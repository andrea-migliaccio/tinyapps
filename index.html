<!DOCTYPE html>

<head>
<meta charset="utf-8">

<title>tinyapps · small indie game studio</title>
<meta name="description" content="tinyapps è un piccolo studio indie che crea giochi semplici, fatti per divertire. Scribble Racers, Off Course e altri.">
<meta property="og:title" content="tinyapps · small indie game studio">
<meta property="og:description" content="Small games, made for fun.">

<style>
  :root {
    --bg: #faf6f0;
    --card: #ffffff;
    --ink: #2b2530;
    --muted: #6f6673;
    --line: #ece4da;
    --accent: #f26b1d;
    --accent-soft: #fff1e7;
    --blue: #2f5fd0;
    --shadow: 0 1px 2px rgba(43, 37, 48, .06), 0 12px 32px rgba(43, 37, 48, .08);
    --radius: 20px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

  /* Nav */
  nav { display: flex; align-items: center; justify-content: space-between; padding: 22px 0; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.2rem; letter-spacing: -.3px; text-decoration: none; }
  .brand .mark {
    width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    background: var(--ink); color: #fff; font-size: 18px;
  }
  .nav-right { display: flex; align-items: center; gap: 18px; }
  .nav-right a.navlink { text-decoration: none; color: var(--muted); font-weight: 600; font-size: .95rem; }
  .nav-right a.navlink:hover { color: var(--ink); }
  .lang { display: inline-flex; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 3px; }
  .lang button {
    border: 0; background: transparent; font: inherit; font-weight: 700; font-size: .8rem;
    padding: 5px 11px; border-radius: 999px; cursor: pointer; color: var(--muted);
  }
  .lang button.active { background: var(--ink); color: #fff; }
  @media (max-width: 560px) { .nav-right a.navlink { display: none; } }

  /* Hero */
  .hero { padding: 56px 0 64px; display: grid; gap: 28px; }
  .eyebrow {
    display: inline-block; font-size: .78rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
    color: var(--accent);
  }
  .hero h1 { margin: 10px 0 0; font-size: clamp(2.2rem, 5vw, 3.6rem); line-height: 1.08; letter-spacing: -1.5px; max-width: 16ch; }
  .hero .lead { margin: 0; font-size: 1.15rem; color: var(--muted); max-width: 62ch; }
  .support {
    display: flex; gap: 16px; align-items: flex-start; background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 20px 22px; max-width: 760px;
  }
  .support .ico { font-size: 26px; line-height: 1; }
  .support p { margin: 0; color: var(--ink); }
  .support a { color: var(--accent); font-weight: 700; }

  section { padding: 8px 0 56px; }
  .section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
  .section-head h2 { margin: 0; font-size: 1.6rem; letter-spacing: -.5px; }
  .section-head span { color: var(--muted); font-size: .95rem; }

  /* Featured games */
  .featured { display: grid; gap: 28px; grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 860px) { .featured { grid-template-columns: 1fr; } }
  .game {
    background: var(--card); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
    display: flex; flex-direction: column; border: 1px solid var(--line);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .game:hover { transform: translateY(-4px); box-shadow: 0 2px 4px rgba(43,37,48,.06), 0 22px 48px rgba(43,37,48,.14); }
  .media { position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: #efe6da; }
  .media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .45s ease, transform .6s ease; }
  .media img.shot { opacity: 0; }
  .game:hover .media img.shot { opacity: 1; }
  .game:hover .media img { transform: scale(1.03); }
  .game.sr .media { background: #ecebe6; }
  .game.sr .media img.cover { object-fit: contain; }
  .game.oc .media { background: #ecd6b3; }
  .game.oc .media img.cover { object-fit: contain; padding: 12px; }
  .status {
    position: absolute; top: 14px; left: 14px; z-index: 2; font-size: .75rem; font-weight: 800;
    padding: 5px 11px; border-radius: 999px; background: rgba(255,255,255,.92); color: var(--ink);
    backdrop-filter: blur(4px); box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  .status::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; background: #2fb36b; }
  .status.dev::before { background: #f2a81d; }
  .game .body { padding: 24px 26px 26px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
  .game h3 { margin: 0; font-size: 1.6rem; letter-spacing: -.5px; }
  .game .tagline { margin: 0; font-weight: 700; color: var(--accent); }
  .game.sr .tagline { color: #d0342c; }
  .game p.desc { margin: 0; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: .75rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: #f4efe8; color: var(--muted); }
  .stores { margin-top: auto; padding-top: 10px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .store {
    display: inline-flex; align-items: center; gap: 10px; text-decoration: none;
    padding: 9px 16px 9px 12px; border-radius: 12px; background: var(--ink); color: #fff;
    min-height: 48px; transition: filter .2s, transform .2s;
  }
  .store:hover { filter: brightness(1.2); }
  .store svg { width: 24px; height: 24px; flex: none; }
  .store .lbl { display: flex; flex-direction: column; line-height: 1.1; }
  .store .lbl small { font-size: .68rem; opacity: .75; font-weight: 600; }
  .store .lbl b { font-size: 1rem; }
  .store.itch { background: #fa5c5c; }
  .store.disabled {
    background: #e9e4de; color: #9a9298; cursor: not-allowed; pointer-events: none; position: relative;
  }
  .store.disabled svg { filter: grayscale(1); opacity: .55; }
  .store .lbl small.soon { color: var(--accent); opacity: 1; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; font-size: .62rem; }

  /* Other games */
  .others { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .mini {
    display: flex; gap: 18px; align-items: flex-start; background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 20px; text-decoration: none; transition: transform .2s, border-color .2s;
  }
  .mini:hover { transform: translateY(-3px); border-color: #dccfbf; }
  .mini .icon { width: 52px; height: 52px; flex: none; border-radius: 14px; display: grid; place-items: center; font-size: 26px; background: #e9f3e3; }
  .mini:nth-child(2) .icon { background: #e3edfb; }
  .mini h3 { margin: 0 0 2px; font-size: 1.15rem; }
  .mini .host { font-size: .8rem; font-weight: 700; color: var(--accent); }
  .mini p { margin: 6px 0 0; color: var(--muted); font-size: .95rem; }
  .mini .go { margin-top: 10px; font-weight: 700; font-size: .9rem; }

  footer { border-top: 1px solid var(--line); padding: 28px 0 40px; color: var(--muted); font-size: .9rem; }
  footer .wrap { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; }
  footer a { color: var(--ink); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

      lead: "tinyapps è un minuscolo game studio indipendente. Creiamo giochi semplici, con cura, per il puro piacere di farli. Se riusciamo a strappare un sorriso a qualcuno, abbiamo già vinto.",

      srC2: "Sfida giornaliera",

      ocC3: "30 easter egg",
      playOn: "Gioca su",
      moreGames: "Altri giochi",
      moreSub: "Giocabili subito nel browser",

      playBrowser: "Gioca ora →",
      footer: "Fatto con ❤️ da Andrea"
    },
    en: {
      navGames: "Games",
      eyebrow: "Tiny indie studio",
      title: "Small games, made for fun.",
      lead: "tinyapps is a tiny independent game studio. We make simple games, with care, just for the joy of making them. If we manage to make someone smile, we've already won.",

      footer: "Made with ❤️ by Andrea"

  function setLang(l) {
    document.documentElement.lang = l;
    document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = T[l][el.dataset.i18n]);
    document.querySelectorAll("[data-i18n-html]").forEach(el => el.innerHTML = T[l][el.dataset.i18nHtml]);
    document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("active", b.dataset.lang === l));
    localStorage.setItem("lang", l);
  }
  document.querySelectorAll(".lang button").forEach(b => b.onclick = () => setLang(b.dataset.lang));
  setLang(localStorage.getItem("lang") || ((navigator.language || "it").startsWith("it") ? "it" : "en"));
  document.getElementById("year").textContent = new Date().getFullYear();
</script>
